[pytest]
markers =
    integration: tests that perform full end-to-end cycles (build, install, launch, rollback); excluded from FAST and often TARGETED.
    zealfie_slow: ZeAlfie tests that involve real wheel building, venv creation, pip installs, or other heavy operations; excluded from FAST.

# Default: unmarked = FAST

# Retention: keep only the last failed run's tmp artifacts (for diagnostics);
# successful runs are cleaned up automatically. See docs/testing.md for FULL
# runs on disk-backed scratch (tmpfs /tmp is only 3.8 GB).
tmp_path_retention_count = 1
tmp_path_retention_policy = failed

# Canonical collection: only tests/ is collected. AGENT/, build/, dist/ and
# .venv/ must never be recursed (review bundles unpacked under AGENT/review
# previously caused module-name collisions with tests/).
testpaths = tests
norecursedirs = .git build dist AGENT .venv

# ZeAlfie Windows standalone INSTALLER build — bounded CI witness (ZA-WIN-BOOT-02; substrate ZA-WIN-BOOT-03B).
#
# Builds the REAL native Windows installer ZeAlfie-Setup-<version>-dev.exe
# (Inno Setup 6.7.3, pinned) that turns a normal user machine into the
# proven ZA-WIN-BOOT-01 layout (private pinned CPython 3.13.15 -> appenv ->
# ZeAlfie) WITHOUT freezing the app (no PyInstaller/Nuitka) and with a FULLY
# OFFLINE user install (bundled SHA-256-locked wheelhouse, pip
# --no-index --find-links, no PyPI on the user machine).
#
# Substrate (ZA-WIN-BOOT-03B): the private CPython is a
# python-build-standalone (astral-sh) install_only tarball — plain
# relocatable files with NO installer/Burn/MSI/registry provider state.  It
# is downloaded, SHA-256-verified (fail closed) and extracted at BUILD time
# by the driver python (stdlib tarfile); Inno embeds the already-extracted
# files under {app}\python, so the end-user Setup needs no tar/PowerShell
# archive/7-Zip/Python/network.
#
# Triggers: workflow_dispatch AND push on the feature branch (a push
# trigger is part of the design — not an afterthought bootstrap).
#
# Sequence (every step must succeed on its own; fail closed):
#   checkout
#     -> provision + verify the PINNED Inno Setup compiler (exact version
#        logged BEFORE compilation; absent/different = job failure)
#     -> build the zealfie wheel
#     -> acquire the locked wheelhouse (pip download --no-deps, exact pins)
#        and verify every SHA-256 against wheelhouse.lock.toml
#     -> offline-closure preflight on the Windows runner: pip install
#        --no-index --find-links --dry-run --ignore-installed <zealfie wheel>
#        — the authoritative Windows closure check (evaluates os_name ==
#        "nt" markers such as build's colorama dep) and must pass with NO
#        PyPI before compilation
#     -> acquire the pinned python-build-standalone archive: download +
#        SHA-256 verify against reproducibility.toml (fail closed) +
#        extract to $ZEALFIE_STAGE/python (provision_windows.py
#        provision-python, stdlib tarfile)
#     -> compile packaging/windows/installer/zealfie.iss with
#        /DPythonDir=$ZEALFIE_STAGE/python (the extracted runtime is the
#        [Files] source -> {app}\python)
#     -> SILENT install on the fresh runner (per-user, {localappdata}\Programs\ZeAlfie)
#     -> installer install/provenance smoke from the INSTALLED appenv
#        (layout + provenance + CLI + offscreen GUI + offline pip evidence)
#     -> bounded silent uninstall witness (unins000.exe /VERYSILENT) —
#        seeds representative managed app-data state, then removes the
#        WHOLE installer-owned tree INCLUDING {app}\python AND the whole
#        %LOCALAPPDATA%\zealfie managed app-data tree (ZA-WIN-UNINSTALL-01)
#     -> upload ZeAlfie-Setup*.exe + SHA-256 + provenance.json as an
#        Actions ARTIFACT (never a Release)
#
# No release, no tag, no signing, no secrets.  Installing never touches
# %LOCALAPPDATA%\zealfie (the GUI smoke uses a throwaway runtime root);
# UNINSTALLING removes the whole ZeAlfie-owned managed app-data tree
# (%LOCALAPPDATA%\zealfie — managed runtime slots, work staging, the
# desired-products selection and internal locks) along with {app}, which
# the uninstall witness below proves by seeding representative managed
# state immediately before uninstalling (ZA-WIN-UNINSTALL-01).
#
# Action majors pinned at implementation time (2026-09-03):
#   actions/checkout        -> v7.0.1 (3d3c42e5aac5ba805825da76410c181273ba90b1)
#   actions/setup-python    -> v7.0.0 (5fda3b95a4ea91299a34e894583c3862153e4b97)
#   actions/upload-artifact -> v7.0.1 (043fb46d1a93c77aae656e7c1c64a875d1fc6a0a)
name: "windows installer build"

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-standalone-bootstrap

permissions:
  contents: read

jobs:
  windows-installer-build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - id: stage
        name: Define build staging paths
        shell: bash
        run: |
          echo "ZEALFIE_STAGE=$RUNNER_TEMP/zealfie-installer-build" >> "$GITHUB_ENV"
          echo "ZEALFIE_INSTALL_ROOT=$LOCALAPPDATA/Programs/ZeAlfie" >> "$GITHUB_ENV"

      - id: checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-python
        name: Setup driver Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - id: host-identity
        name: Host identity
        shell: bash
        run: |
          uname -a || true
          python --version
          python -c "import platform; print(platform.platform())"
          echo "runner.os=${{ runner.os }} runner.arch=${{ runner.arch }}"
          mkdir -p "$ZEALFIE_STAGE"/{innosetup,zealfie-dist,wheelhouse,downloads,setup-output,logs}

      - id: provision-innosetup
        name: Provision pinned Inno Setup 6.7.3 (download + SHA-256 verify + silent install)
        shell: bash
        run: |
          set -euo pipefail
          # git-bash would otherwise mangle slash-prefixed tool arguments
          export MSYS2_ARG_CONV_EXCL="*"
          python - "$ZEALFIE_STAGE/innosetup" <<'PY'
          import hashlib, os, sys, tomllib, urllib.request
          from pathlib import Path
          stage = Path(sys.argv[1])
          record = tomllib.load(open("packaging/windows/installer/innosetup.toml", "rb"))["innosetup"]
          target = stage / record["installer_filename"]
          if not target.is_file():
              print(f"[inno] downloading {record['installer_url']}")
              urllib.request.urlretrieve(record["installer_url"], target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          print(f"[inno] downloaded {target.name} ({target.stat().st_size} bytes)")
          print(f"[inno] sha256 {digest}")
          if digest != record["sha256"]:
              raise SystemExit(f"FATAL: Inno Setup installer SHA-256 mismatch: expected {record['sha256']}, got {digest}")
          print(f"[inno] SHA-256 verified against packaging/windows/installer/innosetup.toml")
          PY
          # Silent per-user install into the staging area (no admin needed).
          "$ZEALFIE_STAGE/innosetup/innosetup-6.7.3.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER "/DIR=$ZEALFIE_STAGE/innosetup/is" >/dev/null 2>&1 || { echo "FATAL: Inno Setup installer failed"; exit 1; }
          ISCC="$ZEALFIE_STAGE/innosetup/is/ISCC.exe"
          [ -f "$ISCC" ] || { echo "FATAL: ISCC.exe not found after install: $ISCC"; exit 1; }
          echo "ISCC=$ISCC" >> "$GITHUB_ENV"
          # Exact toolchain provenance = the immutable pinned installer
          # payload (declared version + installer filename + pinned SHA-256
          # verified above) + a clean dedicated staging install + the
          # required ISCC.exe.  The compiler's own PE version resource
          # reports 0.0.0.0 upstream, so it is NOT a version oracle; the
          # pinned payload SHA-256 IS the exact-toolchain proof.
          python - "$ISCC" <<'PY'
          import sys, tomllib
          record = tomllib.load(open("packaging/windows/installer/innosetup.toml", "rb"))["innosetup"]
          iscc = sys.argv[1]
          print(f"inno-compiler-pinned-version={record['version']}")
          print(f"inno-compiler-installer={record['installer_filename']}")
          print(f"inno-compiler-installer-sha256={record['sha256']}")
          print(f"inno-compiler-isc-path={iscc}")
          print("toolchain-provenance=verified-from-pinned-installer")
          PY
          echo "toolchain-provenance=verified-from-pinned-installer" >> "$GITHUB_ENV"

      - id: build-wheel
        name: Build the zealfie wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet build
          python -m build --wheel --outdir "$ZEALFIE_STAGE/zealfie-dist"
          ls -la "$ZEALFIE_STAGE/zealfie-dist"

      - id: acquire-wheelhouse
        name: Acquire the locked offline wheelhouse (download exact pins + verify SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls "$ZEALFIE_STAGE"/zealfie-dist/zealfie-*.whl | head -n 1)
          python packaging/windows/acquire_wheelhouse.py \
            --dest "$ZEALFIE_STAGE/wheelhouse" \
            --zealfie-wheel "$wheel" \
            --provenance-out "$ZEALFIE_STAGE/logs/acquire-provenance.json" \
            2>&1 | tee "$ZEALFIE_STAGE/logs/acquire.log"
          # fail closed if the provenance file does not report ok
          grep -q '"status": "ok"' "$ZEALFIE_STAGE/logs/acquire-provenance.json"

      - id: offline-closure-preflight
        name: Verify the offline wheelhouse closure resolves on Windows (no PyPI)
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls "$ZEALFIE_STAGE"/zealfie-dist/zealfie-*.whl | head -n 1)
          python -m pip install --disable-pip-version-check --no-index \
            --find-links "$ZEALFIE_STAGE/wheelhouse" \
            --dry-run --ignore-installed "$wheel" \
            2>&1 | tee "$ZEALFIE_STAGE/logs/offline-closure-preflight.log"

      - id: acquire-standalone-python
        name: Acquire pinned standalone python (download + SHA-256 verify + extract)
        shell: bash
        run: |
          set -euo pipefail
          # Download the pinned python-build-standalone install_only tarball,
          # verify its SHA-256 against reproducibility.toml (fail closed)
          # and extract it to $ZEALFIE_STAGE/python with stdlib tarfile —
          # the exact same provisioning code path the bootstrap witness uses.
          # NOTE: --witness-root is a GLOBAL option and MUST precede the
          # subcommand (argparse rejects it afterwards — real-run regression
          # 33763688411, fixed in rework-2).
          python packaging/windows/provision_windows.py \
            --witness-root "$ZEALFIE_STAGE" \
            provision-python
          [ -f "$ZEALFIE_STAGE/python/python.exe" ] || { echo "FATAL: staged python.exe missing"; exit 1; }
          [ -f "$ZEALFIE_STAGE/python/pythonw.exe" ] || { echo "FATAL: staged pythonw.exe missing"; exit 1; }
          echo "PYTHON_DIR=$ZEALFIE_STAGE/python" >> "$GITHUB_ENV"

      - id: compile-installer
        name: Compile ZeAlfie-Setup.exe (Inno Setup 6.7.3)
        shell: bash
        run: |
          set -euo pipefail
          export MSYS2_ARG_CONV_EXCL="*"
          mkdir -p "$ZEALFIE_STAGE/setup-output"
          "$ISCC" \
            "/DPythonDir=$PYTHON_DIR" \
            "/DWheelhouseDir=$ZEALFIE_STAGE/wheelhouse" \
            "/DBootstrapDir=${GITHUB_WORKSPACE}/packaging/windows" \
            "/DIconFile=${GITHUB_WORKSPACE}/src/zealfie/icon/zealfie.ico" \
            "/DOutputDir=$ZEALFIE_STAGE/setup-output" \
            "${GITHUB_WORKSPACE}/packaging/windows/installer/zealfie.iss" 2>&1 | tee "$ZEALFIE_STAGE/logs/iscc-compile.log"
          SETUP="$ZEALFIE_STAGE/setup-output/ZeAlfie-Setup-0.1.0-dev.exe"
          [ -f "$SETUP" ] || { echo "FATAL: Setup.exe not produced"; exit 1; }
          echo "SETUP=$SETUP" >> "$GITHUB_ENV"
          ls -la "$ZEALFIE_STAGE/setup-output"

      - id: side-effect-baseline
        name: Side-effect baseline (machine-scope footprint)
        shell: bash
        run: |
          set -euo pipefail
          python packaging/windows/side_effect_witness.py baseline \
            --out "$ZEALFIE_STAGE/setup-output/side-effect-baseline.json"
      - id: silent-install
        name: Silent install on the fresh runner (per-user, default dir)
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export MSYS2_ARG_CONV_EXCL="*"
          "$SETUP" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG="$ZEALFIE_STAGE/logs/setup-install.log"
          rc=$?
          echo "setup.exe exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            echo "FATAL: silent install did not run to completion (exit code $rc)"
            exit 1
          fi
          echo "=== installed layout (top level) ==="
          ls -la "$ZEALFIE_INSTALL_ROOT"
          echo "=== assets ==="
          ls -la "$ZEALFIE_INSTALL_ROOT/assets" || true

      - id: installer-smoke
        name: Installer smoke (installed layout + provenance + CLI + offscreen GUI + offline evidence)
        shell: bash
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: "offscreen"
        run: |
          set -euo pipefail
          APP="$ZEALFIE_INSTALL_ROOT"
          [ -f "$APP/python/python.exe" ]
          [ -f "$APP/python/pythonw.exe" ]
          [ -f "$APP/appenv/Scripts/python.exe" ]
          [ -f "$APP/appenv/Scripts/pythonw.exe" ]
          "$APP/appenv/Scripts/python.exe" "$APP/assets/bootstrap/installer_smoke.py" \
            --install-root "$APP"

      - id: side-effect-install-audit
        name: Side-effect install audit (PATH/launcher/associations/registry deltas)
        shell: bash
        run: |
          set -euo pipefail
          python packaging/windows/side_effect_witness.py verify-install \
            --baseline "$ZEALFIE_STAGE/setup-output/side-effect-baseline.json" \
            --install-root "$ZEALFIE_INSTALL_ROOT" \
            --out "$ZEALFIE_STAGE/setup-output/side-effect-install-audit.json"
      - id: uninstall-witness
        name: Bounded silent uninstall witness
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Guard the Inno slash switches (/VERYSILENT ...) from Git Bash/MSYS
          # path conversion — the same guard the silent-install step uses.
          export MSYS2_ARG_CONV_EXCL="*"
          APP="$ZEALFIE_INSTALL_ROOT"
          UNINS="$APP/unins000.exe"
          [ -f "$UNINS" ] || { echo "FATAL: uninstaller not found: $UNINS"; exit 1; }
          # Seed representative ZeAlfie-owned managed app-data state under
          # the canonical root so the whole-tree cleanup is actually
          # witnessed: a managed runtime state marker, the install
          # work/cache staging marker and the persisted desired-products.toml
          # selection.  (The install-phase audits already ran; this state is
          # created only here, immediately before uninstalling.)
          ZEALFIE_APPDATA="$LOCALAPPDATA/zealfie"
          mkdir -p "$ZEALFIE_APPDATA/runtime/state" "$ZEALFIE_APPDATA/work"
          printf 'marker\n' > "$ZEALFIE_APPDATA/runtime/state/marker.txt"
          printf 'marker\n' > "$ZEALFIE_APPDATA/work/marker.txt"
          printf 'products = ["zefocus"]\n' > "$ZEALFIE_APPDATA/desired-products.toml"
          [ -f "$ZEALFIE_APPDATA/runtime/state/marker.txt" ] || { echo "FATAL: managed app-data seed missing"; exit 1; }
          [ -f "$ZEALFIE_APPDATA/work/marker.txt" ] || { echo "FATAL: managed app-data seed missing"; exit 1; }
          [ -f "$ZEALFIE_APPDATA/desired-products.toml" ] || { echo "FATAL: managed app-data seed missing"; exit 1; }
          # Bounded exit-code capture: set -e must not kill the script before
          # rc=$? records the uninstaller's exit code.
          if "$UNINS" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG="$ZEALFIE_STAGE/logs/setup-uninstall.log"; then
            rc=0
          else
            rc=$?
          fi
          echo "uninstaller exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            echo "FATAL: silent uninstall did not run to completion (exit code $rc)"
            exit 1
          fi
          # Wait for the uninstaller clone to finish deleting itself (bounded).
          for i in $(seq 1 60); do
            [ ! -f "$UNINS" ] && break
            sleep 1
          done
          # Installer-owned state must ALL be gone: assets, the private
          # standalone runtime {app}\python and the appenv {app}\appenv are
          # plain installer-owned files with no external registration, so
          # uninstall removes them WITH the installer (no preservation).
          if [ -f "$APP/assets/zealfie.ico" ]; then
            echo "FATAL: installer-owned asset still present after uninstall: $APP/assets/zealfie.ico"
            exit 1
          fi
          if [ -f "$APP/python/python.exe" ]; then
            echo "FATAL: private standalone runtime not removed by uninstall: $APP/python"
            exit 1
          fi
          if [ -f "$APP/appenv/Scripts/python.exe" ]; then
            echo "FATAL: application environment not removed by uninstall: $APP/appenv"
            exit 1
          fi
          # Start Menu shortcut removed by the uninstaller.
          LNK="$APPDATA/Microsoft/Windows/Start Menu/Programs/ZeAlfie.lnk"
          if [ -f "$LNK" ]; then echo "FATAL: Start Menu shortcut still present after uninstall"; exit 1; fi
          # The whole ZeAlfie-owned managed app-data root (%LOCALAPPDATA%
          # \zealfie — the seeded runtime/work/desired-products state above
          # is the witness) must ALSO be gone: the managed tree is
          # ZeAlfie-owned disposable product/runtime state removed WITH the
          # installer.  Never broadened to {localappdata} itself.
          if [ -e "$ZEALFIE_APPDATA" ]; then
            echo "FATAL: ZeAlfie managed app-data root not removed by uninstall: $ZEALFIE_APPDATA"
            exit 1
          fi
          echo "uninstall witness PASS (assets + private runtime {app}\\python + appenv removed, shortcut removed, whole %LOCALAPPDATA%\\zealfie managed app-data tree removed)"

      - id: side-effect-uninstall-audit
        name: Side-effect uninstall audit (owned state removed, host unchanged)
        shell: bash
        run: |
          set -euo pipefail
          python packaging/windows/side_effect_witness.py verify-uninstall \
            --baseline "$ZEALFIE_STAGE/setup-output/side-effect-baseline.json" \
            --install-root "$ZEALFIE_INSTALL_ROOT" \
            --out "$ZEALFIE_STAGE/setup-output/side-effect-uninstall-audit.json"
      - id: provenance
        name: Provenance + checksums
        shell: bash
        run: |
          set -euo pipefail
          SETUP="$ZEALFIE_STAGE/setup-output/ZeAlfie-Setup-0.1.0-dev.exe"
          SHA=$(python -c "import hashlib;print(hashlib.sha256(open(r'$SETUP','rb').read()).hexdigest())")
          SIZE=$(stat -c %s "$SETUP")
          echo "$SHA  ZeAlfie-Setup-0.1.0-dev.exe" > "$ZEALFIE_STAGE/setup-output/ZeAlfie-Setup-0.1.0-dev.exe.sha256"
          echo "setup sha256: $SHA"
          echo "setup size:   $SIZE"
          echo "SETUP_SHA=$SHA" >> "$GITHUB_ENV"
          echo "SETUP_SIZE=$SIZE" >> "$GITHUB_ENV"
          # GITHUB_ENV is not visible within the current step, so the SHA/size
          # are ALSO passed directly to this step's Python via the environment.
          SETUP_SHA="$SHA" SETUP_SIZE="$SIZE" python - <<'PY'
          import json, os, tomllib
          with open(os.path.join(os.environ["ZEALFIE_STAGE"], "logs",
                                 "acquire-provenance.json"),
                    encoding="utf-8") as fh:
              wheel = json.load(fh)
          # The substrate pin is the authoritative record (already verified
          # fail-closed by the acquire-standalone-python step).
          with open("packaging/windows/reproducibility.toml", "rb") as fh:
              cpy = tomllib.load(fh)["cpython"]
          prov = {
              "artifact": "ZeAlfie-Setup-0.1.0-dev.exe",
              "zealfie_version": "0.1.0",
              "source_commit": os.environ.get("GITHUB_SHA", ""),
              "inno_setup": "6.7.3 (pinned, packaging/windows/installer/innosetup.toml)",
              "python_substrate": {
                  "kind": cpy["substrate"],
                  "version": cpy["version"],
                  "upstream_repo": cpy["upstream_repo"],
                  "release_tag": cpy["release_tag"],
                  "target_triple": cpy["target_triple"],
                  "installer_filename": cpy["installer_filename"],
                  "sha256": cpy["sha256"],
                  "size": cpy["size"],
                  "acquired_at_build": "sha256-verified + extracted at CI build time (stdlib tarfile); embedded as plain files under {app}\\python",
                  "license": "PSF CPython — staged under {app}\\assets\\licenses (packaging/windows/licenses/)",
              },
              "install": "per-user, offline (bundled wheelhouse, pip --no-index --find-links), no PATH/launcher/associations/provider registration",
              "setup_sha256": os.environ["SETUP_SHA"],
              "setup_size": int(os.environ["SETUP_SIZE"]),
              "wheelhouse": wheel,
          }
          out = os.path.join(os.environ["ZEALFIE_STAGE"], "setup-output", "provenance.json")
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(prov, fh, indent=2)
          print("provenance written:", out)
          PY

      - id: upload-artifacts
        name: Upload Setup.exe + SHA-256 + provenance as an ARTIFACT
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zealfie-setup-0.1.0-dev
          path: |
            ${{ runner.temp }}/zealfie-installer-build/setup-output/*
            ${{ runner.temp }}/zealfie-installer-build/logs/*.log
          if-no-files-found: warn
          retention-days: 14

      - id: diagnostics
        name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "=== install root ==="
          ls -laR "$ZEALFIE_INSTALL_ROOT" 2>/dev/null | head -n 160 || true
          echo "=== appenv pip log ==="
          tail -n 60 "$ZEALFIE_INSTALL_ROOT/logs/appenv-pip-install.log" 2>/dev/null || true
          echo "=== python extract log ==="
          tail -n 40 "$ZEALFIE_STAGE/logs/python-extract.log" 2>/dev/null || true
          echo "=== iscc compile log ==="
          tail -n 40 "$ZEALFIE_STAGE/logs/iscc-compile.log" 2>/dev/null || true
          echo "=== setup install log ==="
          tail -n 60 "$ZEALFIE_STAGE/logs/setup-install.log" 2>/dev/null || true
          echo "=== acquire log ==="
          tail -n 20 "$ZEALFIE_STAGE/logs/acquire-provenance.json" 2>/dev/null || true

      - id: step-summary
        name: Step summary
        if: always()
        shell: bash
        env:
          OUT_CHECKOUT: "${{ steps.checkout.outcome }}"
          OUT_SETUP: "${{ steps.setup-python.outcome }}"
          OUT_INNO: "${{ steps.provision-innosetup.outcome }}"
          OUT_BUILD: "${{ steps.build-wheel.outcome }}"
          OUT_ACQUIRE: "${{ steps.acquire-wheelhouse.outcome }}"
          OUT_CLOSURE: "${{ steps.offline-closure-preflight.outcome }}"
          OUT_CPYTHON: "${{ steps.acquire-standalone-python.outcome }}"
          OUT_COMPILE: "${{ steps.compile-installer.outcome }}"
          OUT_INSTALL: "${{ steps.silent-install.outcome }}"
          OUT_SMOKE: "${{ steps.installer-smoke.outcome }}"
          OUT_UNINSTALL: "${{ steps.uninstall-witness.outcome }}"
          OUT_SE_BASELINE: "${{ steps.side-effect-baseline.outcome }}"
          OUT_SE_INSTALL: "${{ steps.side-effect-install-audit.outcome }}"
          OUT_SE_UNINSTALL: "${{ steps.side-effect-uninstall-audit.outcome }}"
        run: |
          {
            echo "## ZeAlfie Windows installer build (ZA-WIN-BOOT-02 / ZA-WIN-BOOT-03B)"
            echo "**Native Inno Setup 6.7.3 installer wrapping the proven python-build-standalone -> appenv layout. Fully OFFLINE user install (bundled wheelhouse, --no-index). Artifact only — no Release, no signing.**"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Runner | ${{ runner.os }} ${{ runner.arch }} |"
            echo "| ZeAlfie HEAD | ${{ github.sha }} |"
            echo "| Inno Setup | 6.7.3 (pinned) |"
            echo "| Python substrate | python-build-standalone 3.13.15 (sha256-verified + extracted at build; embedded plain files) |"
            echo "| Setup artifact | ZeAlfie-Setup-0.1.0-dev.exe (sha256 \`${{ env.SETUP_SHA }}\`) |"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Checkout | ${OUT_CHECKOUT:-NOT REACHED} |"
            echo "| Setup driver Python | ${OUT_SETUP:-NOT REACHED} |"
            echo "| Provision Inno Setup 6.7.3 | ${OUT_INNO:-NOT REACHED} |"
            echo "| Build zealfie wheel | ${OUT_BUILD:-NOT REACHED} |"
            echo "| Acquire locked wheelhouse | ${OUT_ACQUIRE:-NOT REACHED} |"
            echo "| Offline closure preflight | ${OUT_CLOSURE:-NOT REACHED} |"
            echo "| Verify standalone python | ${OUT_CPYTHON:-NOT REACHED} |"
            echo "| Compile Setup.exe | ${OUT_COMPILE:-NOT REACHED} |"
            echo "| Silent install | ${OUT_INSTALL:-NOT REACHED} |"
            echo "| Installer smoke | ${OUT_SMOKE:-NOT REACHED} |"
            echo "| Uninstall witness | ${OUT_UNINSTALL:-NOT REACHED} |"
            echo "| Side-effect baseline | ${OUT_SE_BASELINE:-NOT REACHED} |"
            echo "| Side-effect install audit | ${OUT_SE_INSTALL:-NOT REACHED} |"
            echo "| Side-effect uninstall audit | ${OUT_SE_UNINSTALL:-NOT REACHED} |"
          } >> "$GITHUB_STEP_SUMMARY"

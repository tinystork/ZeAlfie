# ZA-M1-2J.2 Phase F: real accelerated artifact manifest — CUDA runtime
# closure v2 (human-gated, curated, sandbox-proven).
#
# One [[artifacts]] table per accelerated wheel that ZeAlfie may acquire
# for the NVIDIA_CUDA closure.  Every fact below was verified on
# 2026-08-16 against the PyPI JSON API + the real downloaded wheel bytes
# + a real venv on the physical MX150 (driver 550.163.01); see
#   * AGENT/reports/m1_2j_phase_cd_sandbox_20260816.md (Phase C+D sandbox),
#   * AGENT/tmp/m1_2j_2_cuda_closure/closure_nvidia_cuda_20260816.toml
#     (machine-readable spec), and the Phase A post-mortem for the
#     M1-2J.1 libnvrtc.so.12 witness failure.
#
# Strategy B: 100% userspace CUDA runtime closure (CuPy 14 documented
# behaviour: "only the CUDA driver is needed").  NO system toolkit,
# NO LD_LIBRARY_PATH, NO fastrlock (cupy-cuda12x 14.1.1 does not declare
# it and the full compute matrix A-I passed without it).
#
# Rules (fail-closed, enforced by zealfie.acceleration.acquisition):
#   * sha256 is MANDATORY (64 hex chars) — an entry without it is rejected;
#   * url must be file:// or http(s)://;
#   * (distribution, backend, platform, python) must be unique per entry,
#     and filenames must be unique;
#   * refresh procedure: re-verify the new wheel bytes against PyPI (JSON
#     API https://pypi.org/pypi/<dist>/<version>/json), update version/
#     filename/url/size/sha256/requires_python, and keep the contract in
#     products.toml (specifiers below) and the anti-drift snapshot
#     tests/fixtures/zemosaic_gpu_extra_snapshot.toml in sync.


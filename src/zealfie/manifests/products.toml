[[products]]
id = "zemosaic"
display_name = "ZeMosaic"
distribution_name = "ZeMosaic"
description = "Mosaic planner and composer — stitch, align, and blend multi-panel deep sky images."

[products.remote_source]
owner = "tinystork"
repo = "zemosaic"
ref = "main"

[products.channels]
stable = "main"

# ZA-M1-2J.2 Phase F: accelerated contract declared by ZeMosaic itself,
# with the FULL CUDA runtime closure (sandbox-proven on the real MX150,
# driver 550.163.01 — see AGENT/reports/m1_2j_phase_cd_sandbox_20260816.md
# and AGENT/tmp/m1_2j_2_cuda_closure/closure_nvidia_cuda_20260816.toml).
#
# ZeMosaic's real GPU backend is CuPy (audit M1-2J Phase A), shipped as
# the optional `[gpu]` extra `cupy-cuda12x` (pyproject.toml @ f76f9cca...).
# CuPy 14 manages its CUDA runtime 100% in userspace (cuda-pathfinder
# discovery + pinned nvidia-*-cu12 12.4.x wheels — the driver 550 level,
# never 12.9 which is outside driver compatibility).  fastrlock is
# deliberately ABSENT: cupy-cuda12x 14.1.1 does not declare it
# (Requires-Dist verified from the wheel METADATA) and the complete
# compute matrix A-I passed without it.
#
# Specifiers:
#   * cupy-cuda12x `>=14.1.1,<15` — 14.1.1 is the latest stable; floor
#     is the first closure-proven release (cuda-pathfinder discovery,
#     NVRTC 12.4 headers, sm_61 validated, Py3.13/numpy 2.5 tested on the
#     real MX150); `<15` guards a future major before it is proven.
#   * cuda-pathfinder `>=1.3.4,<2` — floor mirrors cupy 14.1.1's own
#     Requires-Dist (`cuda-pathfinder==1.*,>=1.3.4`).
#   * nvidia-*-cu12 pins are EXACT (==) at the 12.4.x driver-550 level,
#     matching the sandbox-proven closure byte-for-byte.
[products.acceleration]
backend = "NVIDIA_CUDA"
optional = true
incompatibilities = []

[[products.acceleration.requirements]]
distribution = "cupy-cuda12x"
specifier = ">=14.1.1,<15"

[[products.acceleration.requirements]]
distribution = "cuda-pathfinder"
specifier = ">=1.3.4,<2"

[[products.acceleration.requirements]]
distribution = "nvidia-cuda-runtime-cu12"
specifier = "==12.4.127"

[[products.acceleration.requirements]]
distribution = "nvidia-cuda-nvrtc-cu12"
specifier = "==12.4.127"

[[products.acceleration.requirements]]
distribution = "nvidia-cublas-cu12"
specifier = "==12.4.5.8"

[[products.acceleration.requirements]]
distribution = "nvidia-cufft-cu12"
specifier = "==11.2.1.3"

[[products.acceleration.requirements]]
distribution = "nvidia-cusparse-cu12"
specifier = "==12.3.1.170"

[[products.acceleration.requirements]]
distribution = "nvidia-curand-cu12"
specifier = "==10.3.5.147"

[[products.acceleration.requirements]]
distribution = "nvidia-cusolver-cu12"
specifier = "==11.6.1.9"

[[products.acceleration.requirements]]
distribution = "nvidia-nvjitlink-cu12"
specifier = "==12.4.127"

[[products.launch.entry_points]]
group = "gui_scripts"
name = "zemosaic"

[[products]]
id = "zeseestarstacker"
display_name = "ZeSeestarStacker"
distribution_name = "ZeSeestarStacker"
description = "One-click star stacking for Seestar S50 users — calibrate, align, and stack automatically."

[[products.launch.entry_points]]
group = "gui_scripts"
name = "zeseestarstacker"

# ZSSS M3: ZeSeestarStacker is a first-class ZeAlfie product.  The stable
# ``main`` branch of tinystork/zeseestarstacker is ZeSeestarStacker 7.1.0
# (wheel zeseestarstacker-7.1.0, entry point gui_scripts:zeseestarstacker).
# ``stable`` follows ``main``; ``beta`` tracks the ``beta`` branch
# (ecosystem convention, same as zeanalyser).
[products.remote_source]
owner = "tinystork"
repo = "zeseestarstacker"
ref = "main"

[products.channels]
stable = "main"
beta = "beta"

# ZeSeestarStacker uses CuPy OPTIONALLY for its drizzle step
# (seestar/core/drizzle_utils.py: ``import cupy as cp`` if available;
# seestar/core/utils.py: check_cupy_cuda).  The closure is therefore
# identical to ZeMosaic's NVIDIA_CUDA contract: the full 10-distribution
# CUDA runtime closure (cupy-cuda12x + cuda-pathfinder + the pinned
# nvidia-*-cu12 12.4.x wheels).  fastrlock is deliberately ABSENT --
# cupy-cuda12x 14.1.1 does not declare it (see the ZeMosaic Phase F
# comment above).
[products.acceleration]
backend = "NVIDIA_CUDA"
optional = true
incompatibilities = []

[[products.acceleration.requirements]]
distribution = "cupy-cuda12x"
specifier = ">=14.1.1,<15"

[[products.acceleration.requirements]]
distribution = "cuda-pathfinder"
specifier = ">=1.3.4,<2"

[[products.acceleration.requirements]]
distribution = "nvidia-cuda-runtime-cu12"
specifier = "==12.4.127"

[[products.acceleration.requirements]]
distribution = "nvidia-cuda-nvrtc-cu12"
specifier = "==12.4.127"

[[products.acceleration.requirements]]
distribution = "nvidia-cublas-cu12"
specifier = "==12.4.5.8"

[[products.acceleration.requirements]]
distribution = "nvidia-cufft-cu12"
specifier = "==11.2.1.3"

[[products.acceleration.requirements]]
distribution = "nvidia-cusparse-cu12"
specifier = "==12.3.1.170"

[[products.acceleration.requirements]]
distribution = "nvidia-curand-cu12"
specifier = "==10.3.5.147"

[[products.acceleration.requirements]]
distribution = "nvidia-cusolver-cu12"
specifier = "==11.6.1.9"

[[products.acceleration.requirements]]
distribution = "nvidia-nvjitlink-cu12"
specifier = "==12.4.127"


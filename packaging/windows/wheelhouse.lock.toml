# ZeAlfie Windows installer — EXACT offline wheelhouse dependency lock (ZA-WIN-BOOT-02).
#
# This lock pins the concrete Windows x64 / CPython 3.13 wheel set that the
# ZeAlfie installer bundles into {app}\assets\wheelhouse.  The installer's
# pip runs FULLY OFFLINE: `pip install --no-index --find-links <wheelhouse>
# <zealfie wheel>` — PyPI is never contacted on the user machine, so this
# lock (plus the SHA-256 verification in acquire_wheelhouse.py) IS the
# supply-chain contract of the offline install.
#
# The list below was NOT guessed and NOT copied from any other document: it
# was produced by a REAL resolution executed on 2026-09-03 with pip 25.1.1
# on Linux, downloading the actual Windows wheels:
#
#   pip download --dest <dir> --only-binary=:all: \
#       --platform win_amd64 --python-version 3.13 \
#       --implementation cp --abi cp313 \
#       packaging>=24 PySide6>=6 build>=1.2 setuptools>=77 wheel>=0.45
#
# (the same five top-level requirements the zealfie wheel declares as its
# runtime dependencies in pyproject.toml, so the resolved set is exactly the
# set the appenv needs).  Every per-wheel SHA-256 below was computed from
# the real downloaded file (sha256sum).  The zealfie wheel itself is built
# locally at acquisition time and therefore carries NO pinned sha256 — its
# digest is computed by the acquisition step and recorded in the CI
# provenance artifact instead.
#
# Acquisition re-downloads with --no-deps <name>==<version> for each pinned
# wheel and VERIFIES filename + SHA-256 + size against this file (fail
# closed on any drift).  See docs/windows-installer.md and
# packaging/windows/acquire_wheelhouse.py.

[metadata]
# ZeAlfie version whose wheel this lock bootstraps.
zealfie_version = "0.1.0"
# Source commit of the zealfie wheel payload (ZeAlfie src tree; HEAD of
# feature/windows-standalone-bootstrap at lock generation; identical src
# payload to the ZA-WIN-BOOT-01 record revision a1a777a2df0).
source_commit = "94f0b5164deb4b9e2ad1bd34dc910e89066b734b"
# pip download target tags (resolution flags; the PySide6 family ships
# cp310-abi3 wheels which satisfy the cp313 request via the stable ABI).
platform_tag = "win_amd64"
python_tag = "cp313"
abi_tag = "cp313"
generated = "2026-09-03"
cpython_version = "3.13.15"
cpython_installer_sha256 = "edec09c4853aeae9ac36efb8c9f95b6b8e2fee65eee56d9767a8b7c69c574403"
# The exact resolution requirement list (top-level, matching pyproject.toml
# [project].dependencies of zealfie) ...
requirements = [
  "packaging>=24",
  "PySide6>=6",
  "build>=1.2",
  "setuptools>=77",
  "wheel>=0.45",
]
pip_command = "pip download --dest <dir> --only-binary=:all: --platform win_amd64 --python-version 3.13 --implementation cp --abi cp313 packaging>=24 PySide6>=6 build>=1.2 setuptools>=77 wheel>=0.45"

[zealfie]
# The freshly-built zealfie wheel is ADDED to the wheelhouse by the
# acquisition step (it can never be downloaded), so it deliberately has no
# sha256 here — only filename/version/source metadata.
name = "zealfie"
version = "0.1.0"
wheel_filename = "zealfie-0.1.0-py3-none-any.whl"
source_commit = "94f0b5164deb4b9e2ad1bd34dc910e89066b734b"
source = "local-build"

# One table per pinned downloadable wheel, keyed by exact filename.
[wheel."build-1.6.0-py3-none-any.whl"]
name = "build"
version = "1.6.0"
sha256 = "f7aaf1ebbb79178a02ba248bb524f2176b256017e17e8e4bd4289c7b38cc2bad"
size = 31187


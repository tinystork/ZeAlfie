# ZeAlfie Windows installer — Inno Setup toolchain reproducibility record (ZA-WIN-BOOT-02).
#
# Inno Setup 6.7.3 is PINNED (the newest 6.x stable release at
# implementation time, 2026-05-26; Inno Setup 7.x exists but the project
# deliberately stays on the mature 6.x line — see docs/windows-installer.md).
# The SHA-256 below is REAL: computed on a Linux host on 2026-09-03 from the
# official jrsoftware/issrc release asset (10 592 232 bytes).  It is never
# fabricated and never guessed.
#
# CI provisioning downloads this exact installer, verifies the digest
# (fail closed on mismatch), silently installs it to a per-user tool
# directory, then asserts the compiler banner contains [innosetup].version
# BEFORE compiling the .iss — a different/absent compiler fails the job.

[innosetup]
# Exact pinned Inno Setup version (6.x line — do NOT jump to 7.x).
version = "6.7.3"
installer_filename = "innosetup-6.7.3.exe"
installer_url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
# sha256 of innosetup-6.7.3.exe as downloaded from the official
# jrsoftware/issrc GitHub release on 2026-09-03.
sha256 = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
size = 10592232
# Compiler executable produced by the silent install (relative to the
# chosen /DIR= tool root).
compiler_exe = "ISCC.exe"
# Version token asserted in the ISCC banner/help output before compiling
# (fail closed on absent/different compiler).
version_probe = "6.7.3"

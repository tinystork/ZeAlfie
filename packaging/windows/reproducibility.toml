# ZeAlfie Windows standalone bootstrap — reproducibility record
# (ZA-WIN-BOOT-01; substrate replaced in ZA-WIN-BOOT-03B).
#
# Substrate: python-build-standalone (astral-sh) "install_only" tarball —
# a plain, relocatable CPython directory tree (python.exe + pythonw.exe +
# full stdlib + bundled pip) with NO installer, NO Burn/MSI, NO registry
# provider state.  It replaces the python.org python-3.13.15-amd64.exe
# per-user installer, whose Burn MajorUpgrade semantics attached the
# private CPython to the host's same-minor python.org install (human
# witness, ZA-WIN-BOOT-03 — see docs/windows-python-substrate.md).
#
# Pinned at implementation time (2026-09-03).  The SHA-256 below is REAL:
# it was computed on a Linux host from the official GitHub release asset
# (https://github.com/astral-sh/python-build-standalone/releases/tag/20260901).
# It is never fabricated and never guessed.
#
# Provisioning and the CI build FAIL CLOSED on any mismatch between this
# record and the artifact actually downloaded: the archive is verified
# (SHA-256) and extracted at CI BUILD time by the driver python (stdlib
# tarfile); the END-USER Setup embeds the already-extracted plain files
# under {app}\python.  The end-user machine never needs tar, PowerShell
# archive extraction, 7-Zip, Python, or network access to install.

[zealfie]
# ZeAlfie version/revision whose wheel this record bootstraps.
version = "0.1.1"
revision = "a1a777a2df065b86c9f7e5305550ac436f60b42d"

[cpython]
# Exact pinned private runtime interpreter: python-build-standalone
# (astral-sh) x86_64-pc-windows-msvc install_only tarball of CPython
# 3.13.15 built from the 20260901 release (full normal CPython: python.exe
# AND pythonw.exe, Lib/ stdlib, bundled pip — python.exe -m pip / venv
# work out of the box; VC++ runtime DLLs vcruntime140.dll(+_1) are
# bundled application-local, so NO machine/user-wide VC++ Redistributable
# is required).
version = "3.13.15"
substrate = "python-build-standalone"
upstream_repo = "astral-sh/python-build-standalone"
release_tag = "20260901"
target_triple = "x86_64-pc-windows-msvc"
installer_filename = "cpython-3.13.15+20260901-x86_64-pc-windows-msvc-install_only.tar.gz"
installer_url = "https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.13.15%2B20260901-x86_64-pc-windows-msvc-install_only.tar.gz"
# sha256 of the tarball above (47 042 104 bytes) computed on a Linux host
# on 2026-09-03 from the official GitHub release asset; verified by
# provisioning and by the CI acquire step BEFORE extraction.
sha256 = "9bcc038a0bf180612ed56dec93d4977d035e80b8d9320ef51a38c287baf134b7"
size = 47042104

[install]
# Per-user, silent, non-admin (Inno PrivilegesRequired=lowest).  There is
# no per-installer option list anymore: the substrate is extracted plain
# files — nothing to pass, nothing to register, no
# PythonCore / Apps&Features / PATH / launcher / association state.
per_user = true
silent = true

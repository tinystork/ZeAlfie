# ZeAlfie macOS ARM64 bundle — EXACT offline wheelhouse dependency lock
# (ZA-MAC-BOOT-01).
#
# This lock pins the concrete macOS arm64 closure that the bundle installs
# into `ZeAlfie.app/Contents/Resources/app` with the PRIVATE bundled Python:
#
#   <bundle python> -m pip install --no-index --find-links <wheelhouse> \
#       --target Contents/Resources/app zealfie-0.1.1-py3-none-any.whl
#
# PyPI is NEVER contacted at build/install time once the wheelhouse is
# staged, so this lock (plus the SHA-256 verification in
# acquire_wheelhouse.py / wheelhouse.py) IS the supply-chain contract of the
# bundle.  There is NO application venv.
#
# The list below was NOT guessed and NOT copied from any other document: it
# was produced by a REAL resolution executed on 2026-09-12 with pip 25.1.1
# on Linux, downloading the actual macOS wheels:
#
#   pip download --dest <dir> --only-binary=:all: \
#       --platform macosx_13_0_universal2 --python-version 3.13 \
#       --implementation cp --abi cp313 \
#       packaging>=24 PySide6>=6 build>=1.2 setuptools>=77 wheel>=0.45
#
# Platform note: the official Qt macOS wheels are tagged
# `macosx_13_0_universal2` (NOT arm64) — that is exactly why the build has a
# mandatory post-install ARM64-only normalisation step (lipo thinning) and a
# fail-closed Mach-O audit.  The PySide6 *meta* package is NOT the binary
# closure: Essentials + Addons + shiboken6 carry the actual Mach-O payload
# and are pinned explicitly below.
#
# Every per-wheel SHA-256 and size below was computed from the real
# downloaded file (sha256sum / stat).  The zealfie wheel itself is built
# locally at acquisition time and therefore carries NO pinned sha256 — its
# digest is computed by the acquisition step and recorded in the build
# provenance instead.

[metadata]
zealfie_version = "0.1.1"
# Source commit of the zealfie wheel payload (ZeAlfie src tree) — the
# origin/main baseline this packaging work was branched from.
source_commit = "fec7015596a3a92ebbb2bdccdfd397297af65981"
platform_tag = "macosx_13_0_universal2"
python_tag = "cp313"
abi_tag = "cp313"
generated = "2026-09-12"
cpython_version = "3.13.15"
requirements = [
  "packaging>=24",
  "PySide6>=6",
  "build>=1.2",
  "setuptools>=77",
  "wheel>=0.45",
]
pip_command = "pip download --dest <dir> --only-binary=:all: --platform macosx_13_0_universal2 --python-version 3.13 --implementation cp --abi cp313 packaging>=24 PySide6>=6 build>=1.2 setuptools>=77 wheel>=0.45"

[zealfie]
# The freshly-built zealfie wheel is ADDED to the wheelhouse by the
# acquisition step (it can never be downloaded), so it deliberately has no
# sha256 here — only filename/version/source metadata.
name = "zealfie"
version = "0.1.1"
wheel_filename = "zealfie-0.1.1-py3-none-any.whl"
source_commit = "fec7015596a3a92ebbb2bdccdfd397297af65981"
source = "local-build"


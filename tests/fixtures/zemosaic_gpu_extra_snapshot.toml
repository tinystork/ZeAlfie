# =============================================================================
# ZA-M1-2J 9A — ANTI-DRIFT SNAPSHOT of the ZeMosaic GPU extra
# =============================================================================
# Source: ZeMosaic `pyproject.toml` at commit
#         f76f9ccaebbc6007b0965b061009871377a686fc
#         ("Release ZeMosaic 4.6.0", branch main/beta)
# Repo:   https://github.com/tinystork/zemosaic (local checkout:
#         /home/tristan/.openclaw/workspace/projects/zemosaic)
#
# The `[project.optional-dependencies]` table and `requires-python`
# below are a VERBATIM copy of the stable pyproject block.  This
# snapshot pins the ZeMosaic-side GPU contract so ZeAlfie's catalog
# contract (src/zealfie/manifests/products.toml, `[products.acceleration]`
# for zemosaic) cannot silently drift away from what ZeMosaic actually
# declares.
#
# REFRESH PROCEDURE (when ZeMosaic's stable GPU extra changes):
#   1. cd /home/tristan/.openclaw/workspace/projects/zemosaic
#   2. git log --oneline main -1   # note the NEW stable commit SHA
#   3. git show <NEW_SHA>:pyproject.toml | sed -n '1,200p'
#   4. Copy the `requires-python` value and the whole
#      `[project.optional-dependencies]` table below VERBATIM.
#   5. Update `zemosaic_commit` to the NEW stable SHA.
#   6. Re-run:
#        pytest -q tests/test_m1_2j_zemosaic_acceleration.py
#      and fix any contract in products.toml /
#      accelerated_artifacts.toml that the anti-drift test flags.
# Do NOT hand-edit the `gpu` list without running the anti-drift test.
#
# ZA-M1-2J.2 Phase F: the [accelerated_closure] table below pins the
# RESOLVED closure (ZeAlfie side) for the zemosaic NVIDIA_CUDA contract
# on linux_x86_64 / cp313 — the exact distributions and versions of
# src/zealfie/manifests/accelerated_artifacts.toml (sandbox-proven on the
# real MX150, driver 550.163.01, 2026-08-16; Phase C/D reports).
# fastrlock is deliberately ABSENT: cupy-cuda12x 14.1.1 no longer
# declares it (Requires-Dist) and the full compute matrix A-I passed
# without it.  Anti-drift: this table must stay in sync with the
# manifest (the anti-drift test compares them); total_download_bytes is
# the exact sum of the ten manifest sizes.
# =============================================================================

zemosaic_commit = "f76f9ccaebbc6007b0965b061009871377a686fc"

requires-python = ">=3.10"

[project.optional-dependencies]
# GPU acceleration is strictly optional. CuPy must NEVER be a base dependency;
# install the variant matching your CUDA toolkit (cupy-cuda12x, cupy-cuda11x, ...).
gpu = [
    "cupy-cuda12x",
]
# Online astrometry.net solving (catalog queries / API solve fallback).
online = [
    "astroquery",
]
# Standalone auxiliary tools (legacy PyQt5 FITS viewer, satellite trail detection).
tools = [
    "PyQt5",
    "acstools",
]
# Development / build / test extras.
dev = [
    "pytest",
    "build",
]
test = [
    "pytest",
]

[accelerated_closure]
distributions = [
    "cupy-cuda12x ==14.1.1",
    "cuda-pathfinder ==1.6.0",
    "nvidia-cuda-runtime-cu12 ==12.4.127",
    "nvidia-cuda-nvrtc-cu12 ==12.4.127",
    "nvidia-cublas-cu12 ==12.4.5.8",
    "nvidia-cufft-cu12 ==11.2.1.3",
    "nvidia-cusparse-cu12 ==12.3.1.170",
    "nvidia-curand-cu12 ==10.3.5.147",
    "nvidia-cusolver-cu12 ==11.6.1.9",
    "nvidia-nvjitlink-cu12 ==12.4.127",
]
total_download_bytes = 1146311007
# Windows closure: byte-verified vs PyPI on 2026-08-17 (win_amd64 / cp313),
# same pins as the Linux closure.

[accelerated_closure_windows]
distributions = [  # same 10 lines as accelerated_closure, identical pins
    "cupy-cuda12x ==14.1.1",
    "cuda-pathfinder ==1.6.0",
    "nvidia-cuda-runtime-cu12 ==12.4.127",
    "nvidia-cuda-nvrtc-cu12 ==12.4.127",
    "nvidia-cublas-cu12 ==12.4.5.8",
    "nvidia-cufft-cu12 ==11.2.1.3",
    "nvidia-cusparse-cu12 ==12.3.1.170",
    "nvidia-curand-cu12 ==10.3.5.147",
    "nvidia-cusolver-cu12 ==11.6.1.9",
    "nvidia-nvjitlink-cu12 ==12.4.127",
]
